id: agent_orchestrated_actor_multi_turn
name: 外部智能体-多轮指挥-与actor自动多轮
version: "1.0.0"
type: agent_test
description: "orchestrator + actor 自动多轮：本地 agent 缺信息时按 [NEED_INTERACTION] 协议追问，模拟用户 actor 按 actor.goal 回答，agent 拿答案后继续指挥直到 [FINAL]"
target: {}
runtime:
  executor: orchestrator
  agent_model: deepseek-v4-flash   # orchestrator 需要真实本地模型（models.yaml 别名），无启发式兜底
  max_turns: 5                  # 最多向外部 agent 发送的指令数
agent:
  type: http
  endpoint: http://192.168.13.130:8490/agentx/workflowstudio/api/v1/run/88b42c2e-4d35-4d2b-91ae-5f941c202040
  query_params:
    stream: "true"
  stream_response: true
  body:
    input_type: chat
    output_type: chat
  ask_user: true                # 本地 agent 缺信息时允许向用户(actor)追问；默认 false=不追问（存量行为）
  description: 能对 GIS 数据集执行查询、叠加求交、缓冲区等空间分析的智能体，可能需要用户补充数据集与范围信息
data: {}
mcp:
  servers: []
  tools:
    required: []
    optional: []
user_task: 对学校做缓冲区分析
actor:
  enabled: true
  max_turns: 3                  # 最多允许 agent↔actor 往返次数
  goal: 使用 schools 数据对学校周边 500 米做缓冲区分析   # 模拟用户的目标/已知信息，actor 回答追问时从中提取
assertions:
  - type: final_response_contains
    value: "完成"
judge:
  enabled: true
pass_criteria:
  required_assertions_passed: true
  judge_score_min: 0.8
