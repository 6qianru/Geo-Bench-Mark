id: vector_buffer_school_package_001
name: 使用矢量分析 Skill Package 完成学校 500 米缓冲区分析
version: 1.0.0
type: agent_skill_test
description: >
  测试 Skill Package 是否按需加载 references，并在调用缓冲区工具前读取对应参考文档。
target:
  skill_id: gis-vector-analysis
  skill_version: 1.0.0
runtime:
  executor: langgraph
  agent_model: rule-based-agent
  actor_model: rule-based-actor
  max_turns: 6
  timeout_seconds: 180
  memory_enabled: false
data:
  fixtures:
    - id: schools
      name: 学校点数据
      type: vector
      format: geojson
      path: ../fixtures/schools.geojson
      crs: EPSG:4326
      geometry_type: Point
      import_as: dataset
      register_metadata: true
      cleanup: true
mcp:
  servers:
    - id: gpa_vector
      name: GPA 矢量分析 MCP 服务
      transport: mock
      url: mock://vector
      required: true
    - id: metadata
      name: 空间元数据 MCP 服务
      transport: mock
      url: mock://metadata
      required: true
  tools:
    required:
      - server: metadata
        name: query_dataset_metadata
      - server: gpa_vector
        name: create_buffer
    optional:
      - server: gpa_vector
        name: reproject_dataset
skill:
  load_mode: package
  path: ../skills/gis-vector-analysis
  entry: SKILL.md
  lazy_load_references: true
  required: true
user_task: >
  请帮我生成 schools 数据周边 500 米的服务范围。
actor:
  enabled: true
  profile: normal_user
  max_turns: 5
  goal: >
    如果智能体询问使用哪个数据，请回答使用 schools 数据。
    如果智能体询问缓冲距离，请回答 500 米。
assertions:
  - type: skill_loaded
    skill_id: gis-vector-analysis
  - type: skill_reference_loaded
    path: references/S0_执行计划.md
  - type: skill_reference_loaded
    path: references/00_数据确认.md
  - type: skill_reference_loaded
    path: references/01_缓冲区分析.md
  - type: skill_reference_loaded
    path: references/10_结果展示.md
  - type: skill_reference_not_loaded
    path: references/05_擦除分析.md
  - type: skill_reference_loaded_before_tool
    reference: references/01_缓冲区分析.md
    tool: create_buffer
  - type: skill_reference_load_count_less_than
    value: 6
  - type: tool_called
    tool: create_buffer
  - type: result_dataset_exists
    alias: buffer_result
judge:
  enabled: true
  rubric:
    - 是否按需加载了执行计划、数据确认、缓冲区分析和结果展示参考文档
    - 是否在调用 create_buffer 前读取了缓冲区分析 reference
    - 是否避免加载无关 reference
pass_criteria:
  required_assertions_passed: true
  judge_score_min: 0.8
