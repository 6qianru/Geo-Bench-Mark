[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoskillbench"
version = "0.1.0"
description = "MVP GIS Agent Skill evaluation system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langgraph>=0.2.50",
  "pydantic>=2.7",
  "PyYAML>=6.0.1",
  "uvicorn>=0.30",
]

[project.scripts]
geoskillbench = "geoskillbench.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
