openapi: 3.1.0
info:
  title: Workflow Studio API
  description: 低代码搭建工作流智能体的 API 文档。
  version: 12.1.0.0
servers:
  - url: http://<agentx-server-host>:8490
    description: 默认 SuperMap Agentx Server 服务器
tags:
  - name: Run Flow
    description: >-
      用于通过 API 直接运行工作流或被网页 Widget 调用。
  - name: MCP Service
    description: >-
      用于提供给 Cursor、Windsurf 等 AI 编辑器的 MCP 协议接口。
  - name: Public Playground
    description: >-
      用于处理无需登录的公共流程构建、事件流式传输。
  - name: A2A Service
    description: >-
      用于暴露符合 A2A 协议的 Agent Card 和 JSON-RPC 调用接口。

paths:
  # ==========================================
  # 场景 1 & 3: API 访问 / 嵌入网站
  # ==========================================
  /agentx/workflowstudio/api/v1/run/{flow_id}:
    post:
      tags:
        - Run Flow
      summary: 运行工作流 (Run Flow)
      description: >-
        **场景使用：**
        1. **API 访问**：通过 curl 或代码直接调用此接口运行 Agent。
        2. **嵌入网站**：`embedded-chat.min.js` 脚本内部会调用此接口与后端通信。
      operationId: run_flow_api_v1_run_post
      parameters:
        - name: flow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: 工作流的 UUID
        - name: stream
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: 是否开启流式响应 (Streaming)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimplifiedAPIRequest'
      responses:
        '200':
          description: 成功响应。根据 stream 参数可能返回 JSON 结果或 SSE 流。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'

  # ==========================================
  # 场景 2: MCP 服务
  # ==========================================
  /agentx/workflowstudio/api/v1/mcp/project/{project_id}/sse:
    get:
      tags:
        - MCP Service
      summary: MCP SSE 连接端点
      description: >-
        **场景使用：**
        对应 MCP 配置中的 URL。MCP 客户端（如 Cursor）连接此端点以接收服务器发送的事件 (Server-Sent Events)。
      operationId: mcp_sse_connection
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: 对应 URL 中的 ID (通常是 Folder ID 或 Project ID)
      responses:
        '200':
          description: SSE 连接建立成功
          content:
            text/event-stream:
              schema:
                type: string

  /agentx/workflowstudio/api/v1/mcp/project/{project_id}:
    post:
      tags:
        - MCP Service
      summary: MCP 消息处理
      description: >-
        **场景使用：**
        虽然配置中通常只写 SSE 地址，但 MCP 协议会通过 POST 请求向此基地址发送 JSON-RPC 消息以执行工具调用。
      operationId: mcp_message_handler
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: MCP JSON-RPC 消息体
      responses:
        '200':
          description: 消息处理成功
          content:
            application/json:
              schema:
                type: object

  # ==========================================
  # 场景 4: 可分享的试验场 (Public Playground)
  # ==========================================
  /agentx/workflowstudio/api/v1/flows/public_flow/{flow_id}:
    get:
      tags:
        - Public Playground
      summary: 获取公共流程信息
      description: >-
        **场景使用：**
        当用户打开分享链接时，前端首先调用此接口加载流程的基本元数据。
      parameters:
        - name: flow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功获取流程信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowRead'

  /agentx/workflowstudio/api/v1/build_public_tmp/{flow_id}/flow:
    post:
      tags:
        - Public Playground
      summary: 构建临时公共流程
      description: >-
        **场景使用：**
        在公共试验场点击"运行"时调用。
        它会将当前浏览器中的完整 Graph 数据发送给后端进行临时构建。
        
        **注意：** 请求头中通常包含 `Cookie: client_id=...` 用于标识匿名用户会话。
      parameters:
        - name: flow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: start_component_id
          in: query
          schema:
            type: string
          description: 指定开始运行的组件 ID (如 ChatInput)
        - name: log_builds
          in: query
          schema:
            type: boolean
            default: false
        - name: event_delivery
          in: query
          schema:
            type: string
            enum: [streaming, polling]
            default: streaming
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_build_public'
      responses:
        '200':
          description: 构建已初始化，返回 Job ID 或流式数据
          content:
            application/json:
              schema:
                type: object

  /agentx/workflowstudio/api/v1/build/{job_id}/events:
    get:
      tags:
        - Public Playground
      summary: 获取构建事件流
      description: >-
        **场景使用：**
        如果构建接口返回了 job_id 且模式为 polling 或需要监听特定事件，前端会轮询或连接此接口获取运行进度。
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 事件流
          content:
            application/json:
              schema:
                type: object

  # ==========================================
  # 场景 5: A2A 服务
  # ==========================================
  /agentx/workflowstudio/api/v1/a2a/{flow_id}/{component_id}/.well-known/agent-card.json:
    get:
      tags:
        - A2A Service
      summary: 获取 A2A Agent Card
      description: >-
        返回符合 A2A 0.3.0 协议的 Agent Card。客户端可通过该端点发现指定工作流组件暴露的 Agent 名称、能力、默认输入输出模式和 JSON-RPC 地址。
      operationId: get_a2a_agent_card
      parameters:
        - name: flow_id
          in: path
          required: true
          schema:
            type: string
          description: 工作流 ID
        - name: component_id
          in: path
          required: true
          schema:
            type: string
          description: 暴露为 A2A Agent 的组件 ID
      responses:
        '200':
          description: Agent Card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A2AAgentCard'
        '404':
          description: Agent 不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'

  /agentx/workflowstudio/api/v1/a2a/{flow_id}/{component_id}/rpc:
    post:
      tags:
        - A2A Service
      summary: A2A JSON-RPC 调用端点
      description: >-
        统一处理 A2A JSON-RPC 2.0 请求。支持 `message/send`、`message/stream`、`tasks/get` 和 `tasks/cancel`。
        当 method 为 `message/stream` 时，请求头需要包含 `Accept: text/event-stream`，响应为 SSE。
      operationId: handle_a2a_rpc
      parameters:
        - name: flow_id
          in: path
          required: true
          schema:
            type: string
          description: 工作流 ID
        - name: component_id
          in: path
          required: true
          schema:
            type: string
          description: 暴露为 A2A Agent 的组件 ID
        - name: Accept
          in: header
          required: false
          schema:
            type: string
            enum:
              - application/json
              - text/event-stream
          description: "`message/stream` 需要使用 `text/event-stream`"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/A2AJsonRpcRequest'
            examples:
              messageSend:
                summary: 同步发送消息
                value:
                  jsonrpc: '2.0'
                  method: message/send
                  params:
                    message:
                      role: user
                      parts:
                        - kind: text
                          text: Hello, A2A!
                  id: request-001
              taskGet:
                summary: 查询任务状态
                value:
                  jsonrpc: '2.0'
                  method: tasks/get
                  params:
                    task_id: task-123
                  id: request-002
      responses:
        '200':
          description: JSON-RPC 响应或 SSE 流。业务错误也会以 JSON-RPC error 返回，HTTP 状态码通常仍为 200。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A2AJsonRpcResponse'
            text/event-stream:
              schema:
                type: string
                description: "`message/stream` 的 SSE 事件流"

components:
  schemas:
    # 场景 1 输入模型
    SimplifiedAPIRequest:
      type: object
      properties:
        input_value:
          type: string
          description: 输入给 ChatInput 的文本内容
          example: "你好，世界！"
        input_type:
          type: string
          enum: [chat, text, any]
          default: chat
        output_type:
          type: string
          enum: [chat, text, any, debug]
          default: chat
        output_component:
          type: string
          description: 可选，指定输出组件的 ID
        tweaks:
          type: object
          description: 用于覆盖组件参数的微调配置
        session_id:
          type: string
          description: 会话 ID，用于保持上下文
      example:
        output_type: "chat"
        input_type: "chat"
        input_value: "你好，世界！"

    # 场景 1 输出模型
    RunResponse:
      type: object
      properties:
        outputs:
          type: array
          items:
            type: object
        session_id:
          type: string
      description: 运行结果响应

    # 场景 4 构建请求体
    Body_build_public:
      type: object
      properties:
        inputs:
          type: object
          description: 输入值覆盖
        files:
          type: array
          items:
            type: string
          description: 上传的文件列表
        data:
          type: object
          description: >-
            完整的流程图数据 (Graph Data)。
            在公共分享场景中，前端通常会将整个 JSON 图结构发送给后端。
            包含 nodes, edges, viewport 等信息。
      required:
        - data

    # 场景 4 读取模型
    FlowRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        data:
          type: object
        is_component:
          type: boolean
        updated_at:
          type: string
          format: date-time

    # 场景 5 A2A 模型
    A2AAgentCard:
      type: object
      description: A2A 0.3.0 Agent Card
      required:
        - name
        - description
        - version
        - protocolVersion
        - url
        - capabilities
        - defaultInputModes
        - defaultOutputModes
        - preferredTransport
      properties:
        name:
          type: string
          description: Agent 名称
        description:
          type: string
          description: Agent 描述
        version:
          type: string
          example: 1.0.0
        protocolVersion:
          type: string
          example: 0.3.0
        url:
          type: string
          description: JSON-RPC 调用地址
        capabilities:
          type: object
          additionalProperties: true
          properties:
            streaming:
              type: boolean
              example: true
        defaultInputModes:
          type: array
          items:
            type: string
          example: [text, text/plain]
        defaultOutputModes:
          type: array
          items:
            type: string
          example: [text, text/plain]
        preferredTransport:
          type: string
          example: JSONRPC
        skills:
          type: array
          items:
            $ref: '#/components/schemas/A2ASkill'
      additionalProperties: true

    A2ASkill:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string

    A2AJsonRpcRequest:
      type: object
      required:
        - jsonrpc
        - method
      properties:
        jsonrpc:
          type: string
          enum: ['2.0']
        method:
          type: string
          enum:
            - message/send
            - message/stream
            - tasks/get
            - tasks/cancel
          description: A2A JSON-RPC 方法名
        params:
          oneOf:
            - $ref: '#/components/schemas/A2AMessageParams'
            - $ref: '#/components/schemas/A2ATaskParams'
          description: 方法参数
        id:
          oneOf:
            - type: string
            - type: integer
            - type: 'null'
          description: JSON-RPC 请求 ID

    A2AMessageParams:
      type: object
      required:
        - message
      properties:
        message:
          $ref: '#/components/schemas/A2AMessage'

    A2ATaskParams:
      type: object
      required:
        - task_id
      properties:
        task_id:
          type: string

    A2AMessage:
      type: object
      required:
        - role
        - parts
      properties:
        role:
          type: string
          enum: [user, assistant]
        parts:
          type: array
          items:
            $ref: '#/components/schemas/A2AMessagePart'

    A2AMessagePart:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum: [text]
        text:
          type: string

    A2AJsonRpcResponse:
      type: object
      required:
        - jsonrpc
      properties:
        jsonrpc:
          type: string
          example: '2.0'
        result:
          $ref: '#/components/schemas/A2ATaskResult'
        error:
          $ref: '#/components/schemas/A2AJsonRpcError'
        id:
          oneOf:
            - type: string
            - type: integer
            - type: 'null'

    A2ATaskResult:
      type: object
      properties:
        task_id:
          type: string
        status:
          type: string
          enum: [pending, in_progress, completed, failed, cancelled]
        message:
          $ref: '#/components/schemas/A2AMessage'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        cancelled_at:
          type: string
          format: date-time

    A2AJsonRpcError:
      type: object
      properties:
        code:
          type: integer
          description: JSON-RPC 错误码，例如 -32700、-32600、-32601、-32602
        message:
          type: string
        data:
          description: 附加错误信息

    ErrorDetail:
      type: object
      properties:
        detail:
          type: string
